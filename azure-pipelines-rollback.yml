# ============================================================================
# Salesforce Standalone Rollback Pipeline — Azure DevOps
# On-demand "break glass" rollback, independent of the main deploy pipeline.
# Trigger manually from the Azure DevOps UI ("Run pipeline").
#
# TAGGING SAFETY: TagRollbackEvent will NOT run unless DeployRollback's
# result is exactly 'Succeeded'. Every deploy/validate/delete step below
# captures the sf CLI's real exit code immediately after the command runs
# (not after a trailing `cat`, which would mask it) and cross-checks the
# JSON result's own status field as a second safeguard, explicitly exiting
# 1 on any failure so this propagates correctly.
# ============================================================================

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: releaseTag
    displayName: 'Release tag to roll back to. "previous" = second-newest tag (safe default). "latest" = newest tag. Or type an exact tag name.'
    type: string
    default: 'previous'
  - name: testLevel
    displayName: 'Apex test level for rollback deploy'
    type: string
    default: 'RunLocalTests'
    values:
      - RunLocalTests
      - RunAllTestsInOrg
      - NoTestRun
  - name: confirmRollback
    displayName: 'Type CONFIRM to proceed with rollback'
    type: string
    default: ''

variables:
  - group: sf-prod-secrets   # SF_PROD_CONSUMER_KEY, SF_PROD_USERNAME, SF_PROD_LOGIN_URL
  - name: prodAlias
    value: 'prod-org'

# ============================================================================
# STAGE 1: RESOLVE TAG.
# "previous" (default) = second-newest release-* tag — skips the newest,
# since that's normally the release you're rolling back AWAY from.
# "latest" = newest release-* tag. Anything else = exact tag name.
# ============================================================================
stages:
  - stage: ResolveTag
    displayName: 'Resolve rollback target tag'
    jobs:
      - job: ResolveTargetTag
        displayName: 'Determine tag to roll back to'
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              if [ "${{ parameters.releaseTag }}" == "previous" ]; then
                TAG=$(git tag -l "release-*" --sort=-creatordate | sed -n '2p')
                if [ -z "$TAG" ]; then
                  echo "##vso[task.logissue type=error]Fewer than 2 release-* tags found — cannot resolve 'previous'. Use 'latest' or specify an exact tag."
                  exit 1
                fi
                NEWEST=$(git tag -l "release-*" --sort=-creatordate | head -n 1)
                echo "Newest tag (assumed bad, skipped): $NEWEST"
                echo "Auto-resolved to previous release: $TAG"
              elif [ "${{ parameters.releaseTag }}" == "latest" ]; then
                TAG=$(git tag -l "release-*" --sort=-creatordate | head -n 1)
                if [ -z "$TAG" ]; then
                  echo "##vso[task.logissue type=error]No release-* tags found in repo. Nothing to roll back to."
                  exit 1
                fi
                echo "Auto-resolved to latest release: $TAG"
              else
                TAG="${{ parameters.releaseTag }}"
                echo "Using explicitly provided tag: $TAG"
              fi
              echo "##vso[task.setvariable variable=resolvedTag;isOutput=true]$TAG"
            name: resolve
            displayName: 'Resolve target release tag'

# ============================================================================
# STAGE 2: PREPARE — validate inputs and confirm the target tag exists.
# ============================================================================
  - stage: Prepare
    displayName: 'Validate rollback target'
    dependsOn: ResolveTag
    variables:
      resolvedTag: $[ stageDependencies.ResolveTag.ResolveTargetTag.outputs['resolve.resolvedTag'] ]
    jobs:
      - job: CheckInputs
        displayName: 'Check confirmation and tag existence'
        steps:
          - script: |
              if [ "${{ parameters.confirmRollback }}" != "CONFIRM" ]; then
                echo "##vso[task.logissue type=error]Rollback not confirmed. Re-run and type CONFIRM in the confirmRollback parameter."
                exit 1
              fi
            displayName: 'Require explicit confirmation'

          - checkout: self
            fetchDepth: 0

          - script: |
              echo "Resolved rollback target: $(resolvedTag)"
              if ! git rev-parse "$(resolvedTag)" >/dev/null 2>&1; then
                echo "##vso[task.logissue type=error]Tag '$(resolvedTag)' not found in repo."
                exit 1
              fi
              echo "Tag $(resolvedTag) found. Proceeding."
            displayName: 'Verify release tag exists'

# ============================================================================
# STAGE 3: VALIDATE ROLLBACK — check-only deploy of the tagged metadata.
# ============================================================================
  - stage: ValidateRollback
    displayName: 'Validate rollback deploy (check-only)'
    dependsOn:
      - ResolveTag
      - Prepare
    condition: succeeded()
    variables:
      resolvedTag: $[ stageDependencies.ResolveTag.ResolveTargetTag.outputs['resolve.resolvedTag'] ]
    jobs:
      - job: ValidateTaggedDeploy
        displayName: 'sf project deploy validate (tagged commit)'
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              echo "Checking out $(resolvedTag)"
              git checkout $(resolvedTag)
            displayName: 'Checkout resolved release tag'

          - task: DownloadSecureFile@1
            name: prodJwtKey
            displayName: 'Download Prod JWT private key'
            inputs:
              secureFile: 'prod-server.key'

          - script: npm install --global @salesforce/cli
            displayName: 'Install Salesforce CLI'

          - script: |
              sf org login jwt \
                --client-id "$(SF_PROD_CONSUMER_KEY)" \
                --jwt-key-file "$(prodJwtKey.secureFilePath)" \
                --username "$(SF_PROD_USERNAME)" \
                --instance-url "$(SF_PROD_LOGIN_URL)" \
                --alias $(prodAlias)
            displayName: 'Authenticate to Production org (JWT)'

          - script: |
              sf project deploy validate \
                --source-dir force-app \
                --target-org $(prodAlias) \
                --test-level ${{ parameters.testLevel }} \
                --json > rollback-validate-result.json
              VALIDATE_EXIT=$?

              cat rollback-validate-result.json

              VALIDATE_STATUS=$(node -e "
                try {
                  const r = JSON.parse(require('fs').readFileSync('rollback-validate-result.json'));
                  console.log(r.status || (r.result && r.result.status) || 'Unknown');
                } catch (e) { console.log('PARSE_ERROR'); }
              ")
              echo "sf CLI exit code: $VALIDATE_EXIT | reported status: $VALIDATE_STATUS"

              if [ "$VALIDATE_EXIT" -ne 0 ] || [ "$VALIDATE_STATUS" == "Failed" ] || [ "$VALIDATE_STATUS" == "PARSE_ERROR" ]; then
                echo "##vso[task.logissue type=error]Rollback validation FAILED (exit code $VALIDATE_EXIT, status $VALIDATE_STATUS). Stopping here — approval and deploy will not proceed."
                exit 1
              fi

              echo "Rollback validation succeeded."
              exit 0
            displayName: 'Check-only deploy of tagged metadata'

          - publish: rollback-validate-result.json
            artifact: rollback-validate-result

# ============================================================================
# STAGE 4: APPROVE — manual approval gate on the Production environment.
# ============================================================================
  - stage: ApproveRollback
    displayName: 'Manual approval for rollback'
    dependsOn:
      - ResolveTag
      - ValidateRollback
    condition: succeeded()
    variables:
      resolvedTag: $[ stageDependencies.ResolveTag.ResolveTargetTag.outputs['resolve.resolvedTag'] ]
    jobs:
      - deployment: ApprovalGate
        displayName: 'Await Production rollback approval'
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Rollback to $(resolvedTag) approved"
                  displayName: 'Approval confirmed'

# ============================================================================
# STAGE 5: DEPLOY ROLLBACK — redeploys the tagged (previous stable) metadata
# to Production. Uses a git-delta computation so only components that
# actually differ get redeployed, and automatically deletes any net-new
# components the bad release added, that don't exist in the target tag.
# ============================================================================
  - stage: DeployRollback
    displayName: 'Deploy rollback to Production'
    dependsOn:
      - ResolveTag
      - ApproveRollback
    condition: succeeded()
    variables:
      resolvedTag: $[ stageDependencies.ResolveTag.ResolveTargetTag.outputs['resolve.resolvedTag'] ]
    jobs:
      - job: DeployTaggedMetadata
        displayName: 'sf project deploy start (tagged commit)'
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              echo "Current main commit (bad state): $(git rev-parse HEAD)"
              git rev-parse HEAD > /tmp/bad-commit.txt
            displayName: 'Record current (bad) commit'

          - script: |
              npm install --global @salesforce/cli
              echo y | sf plugins install sfdx-git-delta
            displayName: 'Install Salesforce CLI and sfdx-git-delta'

          # DELTA COMPUTATION: --from is the CURRENT (bad) state, --to is
          # the TARGET (old, stable) tag. Produces BOTH package.xml
          # (modified/restored components) and destructiveChanges.xml
          # (net-new additions from the bad release that need deleting).
          - script: |
              BAD_COMMIT=$(cat /tmp/bad-commit.txt)
              mkdir -p rollback-delta
              sf sgd source delta \
                --from "$BAD_COMMIT" \
                --to "$(resolvedTag)" \
                --output-dir rollback-delta \
                --generate-delta
              SGD_EXIT=$?
              if [ $SGD_EXIT -ne 0 ]; then
                echo "##vso[task.logissue type=error]sfdx-git-delta command failed with exit code $SGD_EXIT. No delta was computed — check the log above for the actual CLI error."
                exit 1
              fi

              if [ -f rollback-delta/package/package.xml ]; then
                echo "----- Components to redeploy (delta vs bad state) -----"
                cat rollback-delta/package/package.xml
              else
                echo "No modified/added-back components found."
              fi

              if [ -f rollback-delta/destructiveChanges/destructiveChanges.xml ]; then
                echo "----- Components to delete (net-new additions from bad release) -----"
                cat rollback-delta/destructiveChanges/destructiveChanges.xml
              else
                echo "No components to delete — bad release only modified existing components."
              fi
            displayName: 'Compute delta of changed components (bad state vs target tag)'

          # SAFETY FILTER: strip any standard object (Opportunity, Lead,
          # Account, etc.) that sgd may have incorrectly flagged as a
          # CustomObject to delete — standard objects can never be deleted.
          # See main pipeline for the full explanation of why this happens.
          - script: |
              DESTRUCTIVE="rollback-delta/destructiveChanges/destructiveChanges.xml"
              if [ ! -f "$DESTRUCTIVE" ]; then
                echo "No destructiveChanges.xml to filter."
                exit 0
              fi

              python3 - "$DESTRUCTIVE" << 'PYEOF'
              import sys
              import xml.etree.ElementTree as ET

              target_file = sys.argv[1]
              ns = "{http://soap.sforce.com/2006/04/metadata}"
              ET.register_namespace('', ns.strip('{}'))
              tree = ET.parse(target_file)
              root = tree.getroot()

              removed = []
              for types_el in list(root.findall(f"{ns}types")):
                  type_name_el = types_el.find(f"{ns}name")
                  if type_name_el is not None and type_name_el.text == "CustomObject":
                      for m in list(types_el.findall(f"{ns}members")):
                          if not m.text.endswith("__c"):
                              removed.append(m.text)
                              types_el.remove(m)
                      if not types_el.findall(f"{ns}members"):
                          root.remove(types_el)

              if removed:
                  print(f"##vso[task.logissue type=warning]Removed {len(removed)} standard object(s) incorrectly flagged for deletion: {', '.join(removed)}.")
                  tree.write(target_file, xml_declaration=True, encoding='UTF-8')
              else:
                  print("No standard-object false positives found.")
              PYEOF

              if [ -f "$DESTRUCTIVE" ]; then
                mkdir -p rollback-delta
                cat > rollback-delta/emptyPackage.xml << 'EOF'
              <?xml version="1.0" encoding="UTF-8"?>
              <Package xmlns="http://soap.sforce.com/2006/04/metadata">
                  <version>60.0</version>
              </Package>
              EOF
              fi

              echo "----- destructiveChanges.xml after filtering -----"
              cat "$DESTRUCTIVE"
            displayName: 'Filter out standard objects incorrectly flagged for deletion'

          - script: |
              echo "Checking out $(resolvedTag) to restore known-good metadata"
              git checkout $(resolvedTag)
            displayName: 'Checkout resolved release tag'

          - task: DownloadSecureFile@1
            name: prodJwtKey
            displayName: 'Download Prod JWT private key'
            inputs:
              secureFile: 'prod-server.key'

          - script: |
              sf org login jwt \
                --client-id "$(SF_PROD_CONSUMER_KEY)" \
                --jwt-key-file "$(prodJwtKey.secureFilePath)" \
                --username "$(SF_PROD_USERNAME)" \
                --instance-url "$(SF_PROD_LOGIN_URL)" \
                --alias $(prodAlias)
            displayName: 'Authenticate to Production org (JWT)'

          - script: |
              DESTRUCTIVE="rollback-delta/destructiveChanges/destructiveChanges.xml"
              EMPTY_MANIFEST="rollback-delta/emptyPackage.xml"
              if [ -f "$DESTRUCTIVE" ]; then
                echo "Deleting components added by the bad release, before restoring old metadata..."
                sf project deploy start \
                  --pre-destructive-changes "$DESTRUCTIVE" \
                  --manifest "$EMPTY_MANIFEST" \
                  --target-org $(prodAlias) \
                  --wait 60 \
                  --ignore-warnings \
                  --json > destructive-deploy-result.json
                DEPLOY_EXIT=$?

                cat destructive-deploy-result.json

                DEPLOY_STATUS=$(node -e "
                  try {
                    const r = JSON.parse(require('fs').readFileSync('destructive-deploy-result.json'));
                    console.log(r.status || (r.result && r.result.status) || 'Unknown');
                  } catch (e) { console.log('PARSE_ERROR'); }
                ")
                echo "sf CLI exit code: $DEPLOY_EXIT | reported status: $DEPLOY_STATUS"

                if [ "$DEPLOY_EXIT" -ne 0 ] || [ "$DEPLOY_STATUS" == "Failed" ] || [ "$DEPLOY_STATUS" == "PARSE_ERROR" ]; then
                  echo "##vso[task.logissue type=error]Component deletion FAILED (exit code $DEPLOY_EXIT, status $DEPLOY_STATUS). Check the output above for dependency conflicts or data-loss warnings (e.g. a field still referenced elsewhere). Stopping here — the metadata restore will NOT run, and no rollback tag will be created."
                  exit 1
                fi
                echo "Component deletion succeeded."
              else
                echo "No components to delete — proceeding straight to metadata restore."
              fi
            displayName: 'Delete components added by the bad release (auto-detected)'

          - script: |
              if [ -f rollback-delta/package/package.xml ]; then
                sf project deploy start \
                  --manifest rollback-delta/package/package.xml \
                  --target-org $(prodAlias) \
                  --test-level ${{ parameters.testLevel }} \
                  --wait 60 \
                  --json > rollback-deploy-result.json
                DEPLOY_EXIT=$?

                cat rollback-deploy-result.json

                DEPLOY_STATUS=$(node -e "
                  try {
                    const r = JSON.parse(require('fs').readFileSync('rollback-deploy-result.json'));
                    console.log(r.status || (r.result && r.result.status) || 'Unknown');
                  } catch (e) { console.log('PARSE_ERROR'); }
                ")
                echo "sf CLI exit code: $DEPLOY_EXIT | reported status: $DEPLOY_STATUS"

                if [ "$DEPLOY_EXIT" -ne 0 ] || [ "$DEPLOY_STATUS" == "Failed" ] || [ "$DEPLOY_STATUS" == "PARSE_ERROR" ]; then
                  echo "##vso[task.logissue type=error]Rollback metadata deploy FAILED (exit code $DEPLOY_EXIT, status $DEPLOY_STATUS). Check the output above. Stopping here — no rollback tag will be created."
                  exit 1
                fi
                echo "Rollback metadata deploy succeeded."
              else
                echo "Nothing to redeploy — target state matched the bad state except for deleted components (handled above, if any)."
              fi
            displayName: 'Deploy only the changed components to Production'

          - publish: rollback-delta
            artifact: rollback-delta-manifest

# ============================================================================
# STAGE 6: POST-ROLLBACK TAG — mark this rollback in git history. Only
# reachable if DeployRollback's result is exactly 'Succeeded', since every
# step above now explicitly exits 1 on any real failure.
# ============================================================================
  - stage: TagRollbackEvent
    displayName: 'Tag rollback event'
    dependsOn:
      - ResolveTag
      - DeployRollback
    condition: succeeded()
    variables:
      resolvedTag: $[ stageDependencies.ResolveTag.ResolveTargetTag.outputs['resolve.resolvedTag'] ]
    jobs:
      - job: CreateRollbackTag
        displayName: 'Create rollback marker tag'
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - download: current
            artifact: rollback-delta-manifest

          - script: |
              ROLLBACK_TAG="rollback-$(date +%Y-%m-%d)-to-$(resolvedTag)-$(Build.BuildId)"
              echo "$ROLLBACK_TAG" > /tmp/rollback-tag.txt

              HISTORY_DIR="rollback/history/${ROLLBACK_TAG}"
              mkdir -p "$HISTORY_DIR"

              SRC="$(Pipeline.Workspace)/rollback-delta-manifest"
              [ -f "$SRC/package/package.xml" ] && cp "$SRC/package/package.xml" "$HISTORY_DIR/package.xml"
              [ -f "$SRC/destructiveChanges/destructiveChanges.xml" ] && cp "$SRC/destructiveChanges/destructiveChanges.xml" "$HISTORY_DIR/destructiveChanges.xml"

              cat > "$HISTORY_DIR/README.md" << EOF
              # Rollback record: ${ROLLBACK_TAG}

              - Rolled back to: $(resolvedTag)
              - Triggered by build: $(Build.BuildId)
              - Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)

              \`package.xml\` — components redeployed to restore the target state.
              \`destructiveChanges.xml\` — components deleted (added by the bad release, not present in the target state). Absent if nothing needed deleting.
              EOF

              ls -la "$HISTORY_DIR"
            displayName: 'Prepare rollback history record'

          - script: |
              git config user.email "azuredevops@pipeline"
              git config user.name "Azure Pipeline"
              ROLLBACK_TAG=$(cat /tmp/rollback-tag.txt)
              git checkout main
              git pull origin main
              git add "rollback/history/${ROLLBACK_TAG}"
              git commit -m "Rollback audit record: ${ROLLBACK_TAG}" || echo "Nothing to commit (no delta files generated)"
              git push origin main
              echo "Committed rollback history for ${ROLLBACK_TAG}"
            displayName: 'Commit rollback history to main'

          - script: |
              git config user.email "azuredevops@pipeline"
              git config user.name "Azure Pipeline"
              ROLLBACK_TAG=$(cat /tmp/rollback-tag.txt)
              git tag -a "$ROLLBACK_TAG" -m "Rolled back Production to $(resolvedTag) via Build $(Build.BuildId)"
              git push origin "$ROLLBACK_TAG"
              echo "Rollback event tagged as $ROLLBACK_TAG"
            displayName: 'Tag rollback event on main'

          - script: |
              echo "##vso[task.logissue type=warning]Production was rolled back to $(resolvedTag). main branch still has the reverted changes committed — remember to open a follow-up PR to fix forward or revert the offending commits on main so the branch matches Production."
            displayName: 'Reminder: reconcile main with Production state'